[project]
name = "quick_startup"
version = "1.2"
authors = [{ name = "juso" }, { name = "mopioid" }]
description = """\
Instantly jump to the main menu, skips all intro and loading screens.

Optionally allows you to immediately load into a character after startup.

Offline Helpers mod is recommended if using the safe mode option for faster loading.

Credits to -Ry
"""
dependencies = [
]

[tool.sdkmod]
name = "Quick Startup"
license = {name = "MIT", url = "https://choosealicense.com/licenses/mit/" }
coop_support = "ClientSide"
download = "https://github.com/juso40/bl2sdk-mods/raw/refs/heads/main/quick_startup/quick_startup.sdkmod"
